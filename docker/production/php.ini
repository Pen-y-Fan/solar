; Production hardening for the Solar app

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Note: proc_open/popen are intentionally left enabled — Symfony Process
; (used internally by several Artisan commands) depends on them.
disable_functions = exec,passthru,shell_exec,system,pcntl_exec

allow_url_fopen = Off
allow_url_include = Off

session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Lax
session.use_strict_mode = On

post_max_size = 100M
upload_max_filesize = 100M
memory_limit = 256M
max_execution_time = 60

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 192
