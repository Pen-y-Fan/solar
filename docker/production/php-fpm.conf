[global]
pid = /run/php-fpm/php-fpm.pid
error_log = /dev/stderr
daemonize = no

[www]
user = app
group = app
listen = /run/php-fpm/php-fpm.sock
listen.owner = app
listen.group = app

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

catch_workers_output = yes
decorate_workers_output = no

clear_env = no
